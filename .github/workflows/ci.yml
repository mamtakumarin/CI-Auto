name: CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v6
        with:
         python-version: '3.13' 

      - name: check python version
        run: python -v

